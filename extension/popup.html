<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vidya-OS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="header">
    <div class="logo">
      <div class="logo-icon">📚</div>
      <span class="logo-text">Vidya-OS</span>
    </div>
    <span class="header-badge">Bharat Builds</span>
  </header>

  <!-- Progress Tracker -->
  <section class="section">
    <div class="section-header">
      <span class="section-title">Syllabus Progress</span>
      <button class="icon-btn" id="refresh-btn" title="Refresh">↻</button>
    </div>
    <div id="progress-container">
      <div class="loading-state"><div class="spinner"></div></div>
    </div>
  </section>

  <!-- Ask AI -->
  <section class="ask-section">
    <div class="section-header">
      <span class="section-title">Ask at This Moment</span>
      <span class="section-hint">Captures your screen + timestamp automatically</span>
    </div>
    <div class="input-group">
      <textarea
        id="question-input"
        class="question-input"
        placeholder="What is happening on this slide?"
        rows="1"
      ></textarea>
      <button class="send-btn" id="send-btn" title="Ask Gemini">➤</button>
    </div>
    <div class="answer-box" id="answer-box">
      <p class="placeholder-hint">Ask a question — Gemini will look at what you are watching right now</p>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <span class="footer-text">Powered by Gemini + AWS SAM</span>
    <span class="footer-aws">
      <span class="aws-dot"></span>
      Multimodal · Local
    </span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
